<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- The title, like every other visible string, is set from i18n.js. -->
<title>Quiz</title>
<link rel="stylesheet" href="app.css">
</head>
<body class="console">
<!--
  The host's console: a remote control for the television, laid out for a phone held in one hand.
  Everything the room looks at — the question, the four options, the answer, the standings — is on
  the television (tv.html) and none of it is repeated here. What this page carries is where the
  round stands: which phase the room is in, a copy of the television's clock, how many have
  answered, and the buttons. The information sits at the top and the buttons at the bottom, where the thumb is.
-->
<main class="panel">
  <div class="inner">

    <div class="bar">
      <span id="tag-room" hidden></span>
      <span class="status" id="tag-connection" hidden></span>
      <span id="langs"></span>
    </div>

    <!-- 1 · claim the television, then open a room on it -->
    <section class="view" id="view-setup" hidden>
      <form class="form" id="form-open" autocomplete="off">
        <h1 data-i18n="openHeading"></h1>
        <p class="hint" id="tv-hint"></p>
        <label class="field">
          <span class="k" data-i18n="pairCodeLabel"></span>
          <!-- Four digits, so a phone offers the number pad rather than a keyboard. Not required:
               a console that already holds a screen needs no code, and one that holds none is told
               so by the server in words rather than by a browser tooltip. -->
          <input name="pairCode" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off">
        </label>
        <p class="status ok" id="setup-paired" hidden data-i18n="pairedAlready"></p>
        <label class="field">
          <span class="k" data-i18n="hostKeyLabel"></span>
          <input name="hostKey" type="password" autocomplete="off" required>
        </label>
        <label class="field">
          <span class="k" data-i18n="setLabel"></span>
          <select name="setId" id="set-id"></select>
        </label>
        <button class="cta" type="submit" data-i18n="openButton"></button>
        <p class="error" id="setup-error" role="alert"></p>
      </form>
    </section>

    <!-- 2 · the room is open: what the host needs in order to act, and the buttons that act -->
    <section class="view" id="view-run" hidden>
      <div class="now">
        <div class="label" id="phase"></div>
        <div class="clock" id="tag-clock" hidden></div>
        <div class="counts">
          <span id="tag-question" hidden></span>
          <span id="tag-answered" hidden></span>
        </div>
        <p class="detail" id="phase-detail" hidden></p>
        <!--
          The room has no television in it any more. It belongs here, where the host reads the room,
          because it is the one thing on this page that has to be noticed without being looked for:
          the television is what carries the round, so a host who does not know would wait for a room
          that is itself waiting. Every button below it stays live — closing the room, or carrying on deliberately,
          are both the host's to choose.
        -->
        <div class="gone" id="display-gone" hidden role="alert">
          <p class="label" data-i18n="displayGone"></p>
          <p class="detail" data-i18n="displayGoneHint"></p>
        </div>
      </div>

      <div class="acts">
        <p class="error" id="run-error" role="alert"></p>
        <button class="cta go" type="button" id="start" hidden></button>
        <button class="cta" type="button" id="next" hidden></button>
        <!-- The round is over: another one in the same room, from the set picked here. -->
        <label class="field" id="again-field" hidden>
          <span class="k" data-i18n="setLabel"></span>
          <select id="again-set"></select>
        </label>
        <button class="cta go" type="button" id="again" hidden></button>
        <button class="ghost" type="button" id="pause" hidden></button>
        <button class="ghost danger" type="button" id="close-room"></button>

        <!--
          A television that reloaded has fallen out of the room and shows a fresh code, asking for
          it to be typed in: claiming it again is what puts it back. Folded away, because it is
          needed rarely and the four buttons above are what the evening is driven with.
        -->
        <button class="ghost small" type="button" id="repair-open" data-i18n="rePairButton"></button>
        <form class="repair" id="form-repair" autocomplete="off" hidden>
          <p class="hint" data-i18n="rePairHint"></p>
          <label class="field">
            <span class="k" data-i18n="pairCodeLabel"></span>
            <input name="pairCode" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" required>
          </label>
          <button class="ghost" type="submit" data-i18n="pairButton"></button>
        </form>
        <!-- Outside the form, because what it has to say most often is that the form is done with. -->
        <p class="status" id="repair-status" hidden></p>
      </div>
    </section>

  </div>
</main>

<script src="lib/signalr/signalr.min.js"></script>
<script type="module" src="host.js"></script>
</body>
</html>
